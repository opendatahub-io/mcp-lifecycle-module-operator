name: Update Operand Manifests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "MCPLO branch, tag, or SHA; defaults to workflow branch"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

jobs:
  update-manifests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Update operand manifests
        id: update
        env:
          MCPLO_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: make update-operand-manifests

      - name: Check for changes
        id: changes
        run: |
          paths="$(git status --porcelain --untracked-files=all -- \
            go.mod go.sum operand-image.json config/manifests/mcp-lifecycle-operator \
            internal/controller/resources/mcp-lifecycle-operator.yaml)"
          if [[ -n "$paths" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ODH_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.ODH_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: update operand manifests from midstream"
          title: "chore: update operand manifests from midstream"
          # tools/source-update writes these outputs to GITHUB_OUTPUT in the update step.
          body: |
            Synchronized operand source:
            Commit: `${{ steps.update.outputs.source_commit }}`
            Go source version: `${{ steps.update.outputs.source_version }}`
            Operand image: `${{ steps.update.outputs.operand_image }}`
          branch: automated/update-operand-manifests-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
