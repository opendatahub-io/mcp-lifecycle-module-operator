name: Update Operand Manifests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "MCPLO branch, tag, or SHA; defaults to workflow branch"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

jobs:
  dispatch-release-updates:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release updates
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_BRANCHES: |
            rhoai-3.6
        run: |
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            echo "Dispatching operand update for $branch"
            gh workflow run update-operand-manifests.yml \
              --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done <<< "$SUPPORTED_BRANCHES"

  update-manifests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Update operand manifests
        id: update
        env:
          MCPLO_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: make update-operand-manifests

      - name: Check for changes
        id: changes
        run: |
          paths="$(git status --porcelain --untracked-files=all -- \
            go.mod go.sum operand-image.json config/manifests/mcp-lifecycle-operator \
            internal/controller/resources/mcp-lifecycle-operator.yaml)"
          if [[ -n "$paths" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.ODH_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.ODH_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: update operand manifests from midstream"
          title: "[${{ github.ref_name }}] chore: update operand manifests from midstream"
          # tools/source-update writes these outputs to GITHUB_OUTPUT in the update step.
          body: |
            Synchronized operand source:
            Commit: `${{ steps.update.outputs.source_commit }}`
            Go source version: `${{ steps.update.outputs.source_version }}`
            Operand image: `${{ steps.update.outputs.operand_image }}`
          branch: automated/update-operand-manifests-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
